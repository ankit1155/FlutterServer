<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WebSocket Image Test</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            padding: 10px;
            margin: 5px 0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #messages {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
        }

        .sent {
            color: blue;
            margin: 10px 0;
        }

        .received {
            color: green;
            margin: 10px 0;
        }

        .status {
            color: orange;
            margin: 10px 0;
        }

        .chat-image {
            max-width: 300px;
            max-height: 300px;
            display: block;
            margin-top: 5px;
            border-radius: 8px;
        }
    </style>

</head>

<body>

    <h2>HTML WebSocket Client</h2>

    <!-- Text message -->
    <input
        type="text"
        id="txtMessage"
        placeholder="Enter Message">

    <button onclick="sendMessage()">
        Send
    </button>

    <br>

    <!-- Image -->
    <input
        type="file"
        id="imageInput"
        accept="image/*">

    <button onclick="sendImage()">
        Send Image
    </button>

    <div id="messages"></div>


    <script>

        const socket = new WebSocket(
            "wss://flutterserver-by1c.onrender.com"
        );

        const messages = document.getElementById("messages");


        // =========================
        // SOCKET CONNECTED
        // =========================

        socket.onopen = function () {

            addStatus("✅ Connected");

        };


        // =========================
        // RECEIVE MESSAGE
        // =========================

        socket.onmessage = function (event) {

            console.log("Received:", event.data);

            // Check if received data is image
            if (event.data instanceof Blob) {

                showReceivedImage(event.data);

            } else {

                addReceived(event.data);

            }

        };


        // =========================
        // SOCKET CLOSE
        // =========================

        socket.onclose = function () {

            addStatus("❌ Disconnected");

        };


        // =========================
        // SOCKET ERROR
        // =========================

        socket.onerror = function () {

            addStatus("❌ Socket Error");

        };


        // =========================
        // SEND TEXT
        // =========================

        function sendMessage() {

            const txt = document.getElementById("txtMessage");

            if (txt.value.trim() === "") {
                return;
            }

            socket.send(txt.value);

            addSent(txt.value);

            txt.value = "";

        }


        // =========================
        // SEND IMAGE
        // =========================

        function sendImage() {

            const input = document.getElementById("imageInput");

            if (input.files.length === 0) {

                alert("Please select an image");

                return;
            }

            const file = input.files[0];

            console.log("Image:", file.name);
            console.log("Size:", file.size);
            console.log("Type:", file.type);


            // Read image as ArrayBuffer
            const reader = new FileReader();

            reader.onload = function () {

                const arrayBuffer = reader.result;

                // Send image bytes
                socket.send(arrayBuffer);

                addSentImage(file);

            };

            reader.readAsArrayBuffer(file);

        }


        // =========================
        // SHOW SENT IMAGE
        // =========================

        function addSentImage(file) {

            const url = URL.createObjectURL(file);

            messages.innerHTML += `
                <div class="sent">
                    <b>Sent Image:</b>
                    <br>
                    <img
                        src="${url}"
                        class="chat-image">
                </div>
            `;

            scrollBottom();

        }


        // =========================
        // SHOW RECEIVED IMAGE
        // =========================

        function showReceivedImage(blob) {

            const url = URL.createObjectURL(blob);

            messages.innerHTML += `
                <div class="received">
                    <b>Received Image:</b>
                    <br>
                    <img
                        src="${url}"
                        class="chat-image">
                </div>
            `;

            scrollBottom();

        }


        // =========================
        // TEXT UI
        // =========================

        function addSent(msg) {

            messages.innerHTML +=
                `<div class="sent">
                    <b>Sent :</b> ${msg}
                </div>`;

            scrollBottom();

        }


        function addReceived(msg) {

            messages.innerHTML +=
                `<div class="received">
                    <b>Received :</b> ${msg}
                </div>`;

            scrollBottom();

        }


        function addStatus(msg) {

            messages.innerHTML +=
                `<div class="status">
                    ${msg}
                </div>`;

            scrollBottom();

        }


        function scrollBottom() {

            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
